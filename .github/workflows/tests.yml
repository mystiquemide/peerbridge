name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrapper and template tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r sample/backend/requirements.txt
          .venv/bin/python -m unittest tests.test_peerbridge_call tests.test_verified_sender tests.test_templates -v
      - name: One-minute guard check
        run: bin/try-it.sh
      - name: Frontend typecheck
        working-directory: sample/frontend
        run: npm ci && npm run typecheck
      - name: Shell syntax
        run: bash -n setup.sh bin/install-wrapper.sh bin/try-it.sh sample/backend/run.sh
